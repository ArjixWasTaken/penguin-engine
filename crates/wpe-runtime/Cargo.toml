[package]
name = "wpe-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dirs = "7.0.0"
glam = "0.34.1"
glow = "0.18.0"
khronos-egl = { version = "6.0.0", features = ["static"] }
libmpv2 = "6.0.0"
libmpv2-sys = "4.0.1"
mp4parse = "0.17.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tracing = "0.1.44"
wpe-assets = { version = "0.1.0", path = "../wpe-assets" }
wpe-audio = { version = "0.1.0", path = "../wpe-audio" }
wpe-mdl = { version = "0.1.0", path = "../wpe-mdl" }
wpe-media = { version = "0.1.0", path = "../wpe-media" }
wpe-particles = { version = "0.1.0", path = "../wpe-particles" }
wpe-render = { version = "0.1.0", path = "../wpe-render" }
wpe-scene = { version = "0.1.0", path = "../wpe-scene" }
wpe-script = { version = "0.1.0", path = "../wpe-script" }
wpe-shader = { version = "0.1.0", path = "../wpe-shader" }
wpe-text = { version = "0.1.0", path = "../wpe-text" }
wpe-vfs = { version = "0.1.0", path = "../wpe-vfs" }
wpe-web = { version = "0.1.0", path = "../wpe-web", optional = true }

[features]
# Web wallpapers, rendered with Servo.
web = ["dep:wpe-web"]
