[package]
name = "wpe-shader"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glslang = "0.9.1"
glslang-sys = "0.9.2"
naga = { version = "30.0.1", features = ["spv-in"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
thiserror = "2.0.21"
tracing = "0.1.44"
wpe-vfs = { version = "0.1.0", path = "../wpe-vfs" }

[dev-dependencies]
naga = { version = "30.0.1", features = ["spv-in", "wgsl-out"] }
