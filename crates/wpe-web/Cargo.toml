[package]
name = "wpe-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
servo = { version = "=0.7.0", default-features = false, features = ["bundled", "js_jit", "webgl", "media-gstreamer"] }
euclid = "0.22"
url = "2.5"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde_json = "1.0.154"
tracing = "0.1.44"
surfman = { version = "=0.14.0", features = ["sm-x11"] }
gleam = "0.15"
glow = "0.17"
dpi = "0.1"
http = "1.4"
thiserror = "2.0.21"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
