[package]
name = "wpe-library"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
mp4parse = "0.17.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
walkdir = "2.5.0"
wpe-assets = { version = "0.1.0", path = "../wpe-assets" }
wpe-ipc = { version = "0.1.0", path = "../wpe-ipc" }
wpe-vfs = { version = "0.1.0", path = "../wpe-vfs" }

[dev-dependencies]
tempfile = "3.27.0"
