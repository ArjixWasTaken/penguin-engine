[package]
name = "penguind"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
glam = "0.34.1"
# Which applications play sound, for the rules.
libpulse-binding = "2.30.1"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
sd-notify = "0.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.3.18"
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# The system libwayland backend, whose display and surface pointers wgpu needs.
wayland-client = { version = "0.31.15", features = ["system"] }
# KWin's fake input, for handing right clicks to the desktop.
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
wpe-ipc = { version = "0.1.0", path = "../../crates/wpe-ipc" }
wpe-library = { version = "0.1.0", path = "../../crates/wpe-library" }
wpe-render = { version = "0.1.0", path = "../../crates/wpe-render" }
wpe-runtime = { version = "0.1.0", path = "../../crates/wpe-runtime" }

[features]
# Web wallpapers, rendered with Servo (a long first build).
web = ["wpe-runtime/web"]
