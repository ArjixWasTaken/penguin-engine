[package]
name = "scene-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
winit = "0.30"
wpe-render = { version = "0.1.0", path = "../../crates/wpe-render" }
wpe-runtime = { version = "0.1.0", path = "../../crates/wpe-runtime" }

[features]
# Web wallpapers, rendered with Servo (a long first build).
web = ["wpe-runtime/web"]
