[package]
name = "wallpaper-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
rfd = "0.17.2"
iced = { version = "0.14.0", features = ["image", "canvas", "tokio", "lazy", "svg", "advanced"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wpe-ipc = { version = "0.1.0", path = "../../crates/wpe-ipc" }
wpe-library = { version = "0.1.0", path = "../../crates/wpe-library" }
