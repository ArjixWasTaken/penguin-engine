[package]
name = "wpe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
half = "2.7.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
regex = "1.13.1"
serde = "1.0.229"
serde_json = "1.0.154"
texture2ddecoder = "0.1.2"
wpe-assets = { version = "0.1.0", path = "../../crates/wpe-assets" }
wpe-mdl = { version = "0.1.0", path = "../../crates/wpe-mdl" }
wpe-particles = { version = "0.1.0", path = "../../crates/wpe-particles" }
wpe-runtime = { version = "0.1.0", path = "../../crates/wpe-runtime" }
wpe-scene = { version = "0.1.0", path = "../../crates/wpe-scene" }
wpe-script = { version = "0.1.0", path = "../../crates/wpe-script" }
wpe-vfs = { version = "0.1.0", path = "../../crates/wpe-vfs" }
