[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "tools/*"]
# wpe-web pulls in Servo; build it explicitly (`-p wpe-web`, or `--features web`).
default-members = ["crates/wpe-assets", "crates/wpe-audio", "crates/wpe-ipc", "crates/wpe-library", "crates/wpe-mdl", "crates/wpe-media", "crates/wpe-particles", "crates/wpe-render", "crates/wpe-runtime", "crates/wpe-scene", "crates/wpe-script", "crates/wpe-shader", "crates/wpe-text", "crates/wpe-vfs", "apps/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/arjix/wallpaper-engine-rs"

[workspace.dependencies]
wpe-vfs = { path = "crates/wpe-vfs" }
wpe-assets = { path = "crates/wpe-assets" }
wpe-shader = { path = "crates/wpe-shader" }
wpe-scene = { path = "crates/wpe-scene" }
wpe-render = { path = "crates/wpe-render" }
wpe-runtime = { path = "crates/wpe-runtime" }
wpe-ipc = { path = "crates/wpe-ipc" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
